<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="ONMAKE Gear: the lowest level that works" font-family="Helvetica, Arial, sans-serif"><text x="20" y="32" font-size="18" font-weight="bold" fill="#8b949e">ONMAKE Gear: the lowest level that works</text><defs><marker id="u" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,8 L4,0 L8,8 z" fill="#2da44e"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,0 L4,8 z" fill="#db6d28"/></marker></defs><rect x="100" y="56" width="470" height="80" rx="10" fill="#cf222e"/><text x="116" y="82" font-size="15" font-weight="bold" fill="#fff">4  MAX  ·  opus / high, peak at max</text><text x="116" y="102" font-size="13" fill="#fff">design, critical calculations and standards,</text><text x="116" y="122" font-size="13" fill="#fff">login / security, costly decisions</text><rect x="100" y="146" width="470" height="80" rx="10" fill="#8250df"/><text x="116" y="172" font-size="15" font-weight="bold" fill="#fff">3  HIGH  ·  sonnet / high</text><text x="116" y="192" font-size="13" fill="#fff">bugs to understand, integrations,</text><text x="116" y="212" font-size="13" fill="#fff">graphics polish</text><rect x="100" y="236" width="470" height="80" rx="10" fill="#0969da"/><text x="116" y="262" font-size="15" font-weight="bold" fill="#fff">2  MEDIUM  ·  sonnet / medium</text><text x="116" y="282" font-size="13" fill="#fff">edits with known files and lines, tests,</text><text x="116" y="302" font-size="13" fill="#fff">routine publishing</text><rect x="100" y="326" width="470" height="80" rx="10" fill="#1a7f37" stroke="#d4a72c" stroke-width="4"/><text x="116" y="352" font-size="15" font-weight="bold" fill="#fff">1  LIGHT  ·  haiku / low</text><text x="116" y="372" font-size="13" fill="#fff">checks, reads, status, short answers,</text><text x="116" y="392" font-size="13" fill="#fff">first fixes</text><rect x="440" y="316" width="110" height="22" rx="11" fill="#d4a72c"/><text x="495" y="332" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2328">START HERE</text><line x1="40" y1="400" x2="40" y2="70" stroke="#2da44e" stroke-width="5" marker-end="url(#u)"/><line x1="72" y1="70" x2="72" y2="400" stroke="#db6d28" stroke-width="5" marker-end="url(#d)"/><text x="100" y="430" font-size="13" font-weight="bold" fill="#2da44e">▲ UP: it fails, or failure is presumed</text><text x="100" y="452" font-size="13" font-weight="bold" fill="#db6d28">▼ DOWN: as soon as the work gets simpler</text><rect x="610" y="56" width="270" height="130" rx="10" fill="#bc4c00"/><text x="626" y="82" font-size="15" font-weight="bold" fill="#fff">REVERSE</text><text x="626" y="102" font-size="13" fill="#fff">error or wrong result</text><text x="626" y="122" font-size="13" fill="#fff">back to the last STATO.md</text><text x="626" y="142" font-size="13" fill="#fff">find the error with a diff</text><text x="626" y="162" font-size="13" fill="#fff">fix starting from LIGHT</text><rect x="610" y="200" width="270" height="90" rx="10" fill="#57606a"/><text x="626" y="226" font-size="15" font-weight="bold" fill="#fff">Sub-agents, same chat</text><text x="626" y="246" font-size="13" fill="#fff">2-3 in parallel, each at the</text><text x="626" y="266" font-size="13" fill="#fff">right level; the chat coordinates</text><rect x="610" y="304" width="270" height="100" rx="10" fill="#57606a"/><text x="626" y="330" font-size="15" font-weight="bold" fill="#fff">STATO.md</text><text x="626" y="350" font-size="13" fill="#fff">decided, done, missing,</text><text x="626" y="370" font-size="13" fill="#fff">files touched. Read at start,</text><text x="626" y="390" font-size="13" fill="#fff">update before switching model</text><rect x="20" y="470" width="860" height="36" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="36" y="493" font-size="13" fill="#8b949e">DeepSeek / cheap models: small tasks, diff only, automatic check. Never for critical work.</text></svg>
