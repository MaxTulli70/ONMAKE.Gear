<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="ONMAKE Gear: cinque marce LIGHT, MEDIUM, HIGH, OPUS, MAX; il livello più basso che basta, i progetti partono da OPUS" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>ONMAKE Gear: cinque marce, il livello più basso che basta, i progetti partono da OPUS</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#667588" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="304" width="370" height="66" rx="33" fill="#a9c4b0"/><text x="64" y="349" font-size="34" font-weight="700" fill="#1f2933" text-anchor="middle">1</text><text x="98" y="330" font-size="15" font-weight="700" fill="#1f2933">LIGHT</text><text x="98" y="348" font-size="13" fill="#1f2933">controlli, letture, correzioni rapide</text><text x="98" y="362" font-size="11" fill="#2f3b48">haiku / low</text><rect x="140" y="232" width="370" height="66" rx="33" fill="#a7bccf"/><text x="174" y="277" font-size="34" font-weight="700" fill="#1f2933" text-anchor="middle">2</text><text x="208" y="258" font-size="15" font-weight="700" fill="#1f2933">MEDIUM</text><text x="208" y="276" font-size="13" fill="#1f2933">modifiche, test, routine</text><text x="208" y="290" font-size="11" fill="#2f3b48">sonnet / low → medium</text><rect x="250" y="160" width="370" height="66" rx="33" fill="#b8aecb"/><text x="284" y="205" font-size="34" font-weight="700" fill="#1f2933" text-anchor="middle">3</text><text x="318" y="186" font-size="15" font-weight="700" fill="#1f2933">HIGH</text><text x="318" y="204" font-size="13" fill="#1f2933">bug, integrazioni, rifinitura</text><text x="318" y="218" font-size="11" fill="#2f3b48">sonnet / low → high</text><rect x="360" y="88" width="370" height="66" rx="33" fill="#d9a58f"/><text x="394" y="133" font-size="34" font-weight="700" fil