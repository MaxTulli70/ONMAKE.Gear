<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="ONMAKE Gear: il livello più basso che basta" font-family="Helvetica, Arial, sans-serif"><text x="20" y="32" font-size="18" font-weight="bold" fill="#8b949e">ONMAKE Gear: il livello più basso che basta</text><defs><marker id="u" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,8 L4,0 L8,8 z" fill="#2da44e"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,0 L4,8 z" fill="#db6d28"/></marker></defs><rect x="100" y="56" width="470" height="80" rx="10" fill="#cf222e"/><text x="116" y="82" font-size="15" font-weight="bold" fill="#fff">4  MAX  ·  opus / high, picco a max</text><text x="116" y="102" font-size="13" fill="#fff">progettazione, calcoli critici e norme,</text><text x="116" y="122" font-size="13" fill="#fff">login / sicurezza, decisioni costose</text><rect x="100" y="146" width="470" height="80" rx="10" fill="#8250df"/><text x="116" y="172" font-size="15" font-weight="bold" fill="#fff">3  HIGH  ·  sonnet / high</text><text x="116" y="192" font-size="13" fill="#fff">bug da capire, integrazioni,</text><text x="116" y="212" font-size="13" fill="#fff">rifinitura grafica</text><rect x="100" y="236" width="470" height="80" rx="10" fill="#0969da"/><text x="116" y="262" font-size="15" font-weight="bold" fill="#fff">2  MEDIUM  ·  sonnet / medium</text><text x="116" y="282" font-size="13" fill="#fff">modifiche con file e righe note, test,</text><text x="116" y="302" font-size="13" fill="#fff">pubblicazione di routine</text><rect x="100" y="326" width="470" height="80" rx="10" fill="#1a7f37" stroke="#d4a72c" stroke-width="4"/><text x="116" y="352" font-size="15" font-weight="bold" fill="#fff">1  LIGHT  ·  haiku / low</text><text x="116" y="372" font-size="13" fill="#fff">controlli, letture, stato, risposte brevi,</text><text x="116" y="392" font-size="13" fill="#fff">prime correzioni</text><rect x="440" y="316" width="110" height="22" rx="11" fill="#d4a72c"/><text x="495" y="332" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2328">PARTI QUI</text><line x1="40" y1="400" x2="40" y2="70" stroke="#2da44e" stroke-width="5" marker-end="url(#u)"/><line x1="72" y1="70" x2="72" y2="400" stroke="#db6d28" stroke-width="5" marker-end="url(#d)"/><text x="100" y="430" font-size="13" font-weight="bold" fill="#2da44e">▲ SU: non riesce, o si presume che non riesca</text><text x="100" y="452" font-size="13" font-weight="bold" fill="#db6d28">▼ GIÙ: appena il lavoro si semplifica</text><rect x="610" y="56" width="270" height="130" rx="10" fill="#bc4c00"/><text x="626" y="82" font-size="15" font-weight="bold" fill="#fff">REVERSE</text><text x="626" y="102" font-size="13" fill="#fff">errore o risultato sbagliato</text><text x="626" y="122" font-size="13" fill="#fff">torna all'ultimo STATO.md</text><text x="626" y="142" font-size="13" fill="#fff">trova l'errore con un diff</text><text x="626" y="162" font-size="13" fill="#fff">correggi partendo da LIGHT</text><rect x="610" y="200" width="270" height="90" rx="10" fill="#57606a"/><text x="626" y="226" font-size="15" font-weight="bold" fill="#fff">Sotto-agenti, stessa chat</text><text x="626" y="246" font-size="13" fill="#fff">2-3 in parallelo, ognuno al</text><text x="626" y="266" font-size="13" fill="#fff">livello giusto; la chat coordina</text><rect x="610" y="304" width="270" height="100" rx="10" fill="#57606a"/><text x="626" y="330" font-size="15" font-weight="bold" fill="#fff">STATO.md</text><text x="626" y="350" font-size="13" fill="#fff">deciso, fatto, manca,</text><text x="626" y="370" font-size="13" fill="#fff">file toccati. Leggilo all'avvio,</text><text x="626" y="390" font-size="13" fill="#fff">aggiornalo prima di cambiare</text><rect x="20" y="470" width="860" height="36" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5"/><text x="36" y="493" font-size="13" fill="#8b949e">DeepSeek / modelli economici: compiti piccoli, solo diff, controllo automatico. Mai per lavori critici.</text></svg>
